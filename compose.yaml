services:
  coffeepos:
    build: .
    container_name: coffeepos
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8541:8541"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_PIN: ${ADMIN_PIN:?Set ADMIN_PIN in .env}
      DB_PATH: /data/coffeepos.db
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EPSON_HOST: ${EPSON_HOST:-}
      BROTHER_HOST: ${BROTHER_HOST:-}
      PRINT_MODE: ${PRINT_MODE:-mock}
    volumes:
      - ./data:/data
