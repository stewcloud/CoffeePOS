services:
  coffeepos:
    build: .
    container_name: coffeepos
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8541:8541"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_PIN: ${ADMIN_PIN:?Set ADMIN_PIN in .env}
      DB_PATH: /data/coffeepos.db
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EPSON_HOST: ${EPSON_HOST:-}
      EPSON_PORT: ${EPSON_PORT:-9100}
      BROTHER_URL: ${BROTHER_URL:-http://192.168.1.149:8013/api/print/text}
      BROTHER_LABEL_SIZE: ${BROTHER_LABEL_SIZE:-62}
      PRINT_MODE: ${PRINT_MODE:-mock}
    volumes:
      - ./data:/data
