<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoffeePOS</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#30251d;background:#f6f0e7}body{margin:0}header{padding:20px;background:#493426;color:white;display:flex;justify-content:space-between;align-items:center}main{max-width:900px;margin:auto;padding:20px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #b7a99a;border-radius:9px}button{background:#67462f;color:white;cursor:pointer}button:disabled{opacity:.45}article,.panel{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.hidden{display:none}img{width:100%;height:130px;object-fit:cover;border-radius:9px}.muted{color:#756a61}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav{display:flex;gap:8px;margin:16px 0}.error{color:#b31b1b}label{display:block;margin:8px 0}
</style></head><body>
<header><strong>☕ CoffeePOS</strong><span id="identity"></span></header>
<main>
<section id="login" class="panel"><h2>Good morning!</h2><p>Select your name and enter your PIN.</p><form id="loginForm"><label>Name <select id="username"></select></label><label>4-digit PIN <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><button>Sign in</button></form></section>
<section id="app" class="hidden"><nav><button onclick="show('shop')">Order</button><button onclick="show('orders');loadOrders()">Orders</button><button id="adminTab" class="hidden" onclick="show('admin');loadMenu()">Admin</button><button onclick="logout()">Sign out</button></nav>
<div id="shop"><h2>What can I make you?</h2><div id="menu" class="grid"></div><div class="panel"><h3>Your order</h3><div id="cart"></div><label><input type="checkbox" id="togo"> To-go (print drink labels)</label><label>Notes <textarea id="notes" placeholder="Any special requests?"></textarea></label><button onclick="submitOrder()">Place order</button></div></div>
<div id="orders" class="hidden"><h2>Orders</h2><div id="orderList"></div></div>
<div id="admin" class="hidden"><h2>Menu management</h2><div class="panel"><h3>Add category</h3><input id="categoryName" placeholder="Category"><button onclick="addCategory()">Add</button></div><div class="panel"><h3>Add item</h3><input id="itemName" placeholder="Drink name"><input id="itemDesc" placeholder="Description"><input id="itemImage" placeholder="Image URL"><select id="itemCategory"></select><button onclick="addItem()">Add item</button></div><div class="panel"><h3>Add user</h3><input id="newUser" placeholder="Name"><input id="newPin" placeholder="4-digit PIN" maxlength="4"><select id="newRole"><option value="customer">Customer</option><option value="admin">Admin</option></select><button onclick="addUser()">Add user</button></div><div id="inventory"></div></div>
</section><p id="message" role="status"></p></main>
<script>
let user=null,menuData={categories:[],items:[]},cart=[];
async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function msg(s){document.getElementById('message').textContent=s}
function show(id){for(let x of ['shop','orders','admin'])document.getElementById(x).classList.toggle('hidden',x!==id)}
async function loadUsers(){let users=await api('users');document.getElementById('username').replaceChildren(...users.map(u=>new Option(u.name,u.name)))}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{user=await api('login','POST',{name:username.value,pin:pin.value});document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('identity').textContent=user.name;document.getElementById('adminTab').classList.toggle('hidden',user.role!=='admin');await loadMenu();msg('Welcome, '+user.name)}catch(e){msg(e.message)}};
async function logout(){await api('logout','POST');location.reload()}
async function loadMenu(){menuData=await api('menu');let m=document.getElementById('menu');m.replaceChildren();for(let item of menuData.items){let el=document.createElement('article');let h=document.createElement('h3');h.textContent=item.name;el.append(h);if(item.image_url){let img=document.createElement('img');img.src=item.image_url;img.alt=item.name;el.append(img)}let p=document.createElement('p');p.textContent=item.description||'';el.append(p);let btn=document.createElement('button');btn.textContent=item.available?'Add to order':'Sold out';btn.disabled=!item.available;btn.onclick=()=>{let found=cart.find(x=>x.item_id===item.id);if(found)found.quantity++;else cart.push({item_id:item.id,quantity:1});renderCart()};el.append(btn);m.append(el)}let categories=document.getElementById('itemCategory');categories.replaceChildren(...menuData.categories.map(c=>new Option(c.name,c.id)));renderInventory()}
function renderCart(){let c=document.getElementById('cart');c.replaceChildren();for(let x of cart){let item=menuData.items.find(i=>i.id===x.item_id);let p=document.createElement('p');p.textContent=(item?.name||'Item')+' × '+x.quantity+' ';let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{cart=cart.filter(y=>y!==x);renderCart()};p.append(b);c.append(p)}if(!cart.length)c.textContent='Your cart is empty'}
async function submitOrder(){if(!cart.length)return msg('Add a drink first');try{let r=await api('orders','POST',{lines:cart,to_go:document.getElementById('togo').checked,notes:document.getElementById('notes').value});cart=[];renderCart();msg('Order #'+r.id+' submitted! (Printing is not yet enabled)')}catch(e){msg(e.message)}}
async function loadOrders(){try{let orders=await api('orders');let el=document.getElementById('orderList');el.replaceChildren();for(let o of orders){let a=document.createElement('article');let h=document.createElement('h3');h.textContent='#'+o.id+' — '+o.customer+' ('+o.status+')';a.append(h);let p=document.createElement('p');p.textContent=o.lines.map(l=>l.quantity+'× '+l.name).join(', ')+(o.to_go?' · To-go':'');a.append(p);if(user.role==='admin'){let s=document.createElement('select');for(let v of ['new','preparing','ready','completed','canceled'])s.add(new Option(v,v));s.value=o.status;s.onchange=async()=>{await api('orders/'+o.id,'PATCH',{status:s.value});loadOrders()};a.append(s)}el.append(a)}}catch(e){msg(e.message)}}
function renderInventory(){let el=document.getElementById('inventory');el.replaceChildren();for(let item of menuData.items){let a=document.createElement('article');let label=document.createElement('label');label.textContent=item.name+' — Available ';let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!item.available;cb.onchange=async()=>{try{await api('items/'+item.id,'PATCH',{available:cb.checked?1:0});await loadMenu()}catch(e){msg(e.message)}};label.append(cb);a.append(label);el.append(a)}}
async function addCategory(){try{await api('categories','POST',{name:document.getElementById('categoryName').value});await loadMenu();msg('Category added')}catch(e){msg(e.message)}}
async function addItem(){try{await api('items','POST',{name:document.getElementById('itemName').value,description:document.getElementById('itemDesc').value,image_url:document.getElementById('itemImage').value,category_id:Number(document.getElementById('itemCategory').value)});await loadMenu();msg('Item added')}catch(e){msg(e.message)}}
async function addUser(){try{await api('users','POST',{name:document.getElementById('newUser').value,pin:document.getElementById('newPin').value,role:document.getElementById('newRole').value});await loadUsers();msg('User added')}catch(e){msg(e.message)}}
loadUsers().catch(e=>msg(e.message));
</script></body></html>
