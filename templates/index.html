<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoffeePOS</title><style>
:root{font-family:system-ui;color:#30251d;background:#f6f0e7}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#493426;color:white;display:flex;justify-content:space-between}main{max-width:1000px;margin:auto;padding:20px}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #b7a99a;border-radius:8px}button{background:#67462f;color:white;cursor:pointer}.secondary{background:#eee3d7;color:#30251d}.danger{background:#9e2b25}.panel,article{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.hidden{display:none!important}.row,nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav{margin:16px 0}label{display:block;margin:8px 0}.muted{color:#756a61}.error{color:#a51e1e}.success{color:#176b35}img{width:100%;height:130px;object-fit:cover;border-radius:9px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}dialog{border:0;border-radius:14px;max-width:450px;width:90%}dialog::backdrop{background:#0008}
</style></head><body><header><strong>☕ CoffeePOS</strong><span id="identity"></span></header><main>
<section id="login" class="panel"><h2>Welcome</h2><form id="loginForm"><label>Name <select id="username"></select></label><label>4-digit PIN <input id="pin" type="password" inputmode="numeric" maxlength="4" required></label><button>Sign in</button></form></section>
<section id="app" class="hidden"><nav><button data-page="shop">Order</button><button data-page="orders">Orders</button><button data-page="account">My account</button><button id="adminTab" class="hidden" data-page="admin">Admin</button><button id="logout" class="secondary">Sign out</button></nav>
<div id="shop" class="page"><h2>What can I make you?</h2><div id="menu" class="grid"></div><div class="panel"><h3>Your order</h3><div id="cart"></div><label><input type="checkbox" id="togo"> To-go</label><label>Notes <textarea id="notes" maxlength="500"></textarea></label><button id="submitOrder">Place order</button></div></div>
<div id="orders" class="page hidden"><h2>Orders</h2><button id="refreshOrders" class="secondary">Refresh</button><div id="orderList"></div></div>
<div id="account" class="page hidden"><h2>My account</h2><form id="pinForm" class="panel"><label>Current PIN <input id="currentPin" type="password" maxlength="4" required></label><label>New PIN <input id="newPin" type="password" maxlength="4" required></label><button>Change PIN</button></form></div>
<div id="admin" class="page hidden"><h2>Administration</h2><div class="panel"><div class="row"><h3>Users</h3><button id="addUser">Add user</button></div><div id="userList"></div></div><div class="panel"><h3>Categories</h3><form id="categoryForm" class="row"><input id="categoryName" placeholder="New category" required><button>Add</button></form><div id="categoryList"></div></div><div class="panel"><h3>Menu</h3><form id="itemForm" class="row"><input id="itemName" placeholder="Item name" required><input id="itemDesc" placeholder="Description"><input id="itemImage" type="url" placeholder="Image URL"><select id="itemCategory"></select><button>Add</button></form><div id="inventory"></div></div></div></section><p id="message"></p></main>
<dialog id="userDialog"><form id="userForm"><h3 id="userTitle"></h3><input type="hidden" id="userId"><label>Name <input id="userName" required></label><label>Role <select id="userRole"><option value="customer">Customer</option><option value="admin">Admin</option></select></label><label>PIN <input id="userPin" type="password" maxlength="4"><small id="pinHint" class="muted"></small></label><div class="row"><button>Save</button><button type="button" id="cancelUser" class="secondary">Cancel</button></div></form></dialog>
<script>
let me=null,csrf='',menu={categories:[],items:[]},cart=[];const $=x=>document.getElementById(x);function message(x,ok=false){$('message').textContent=x;$('message').className=ok?'success':'error'}async function api(p,m='GET',b){let r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',...(csrf?{'X-CSRF-Token':csrf}:{})},body:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function loadUsers(){let u=await api('users');$('username').replaceChildren(...u.map(x=>new Option(x.name,x.name)))}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==id));if(id==='orders')loadOrders();if(id==='admin')loadAdmin()}document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>show(x.dataset.page));
$('loginForm').onsubmit=async e=>{e.preventDefault();try{me=await api('login','POST',{name:$('username').value,pin:$('pin').value});csrf=me.csrf;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('identity').textContent=me.name+' · '+me.role;$('adminTab').classList.toggle('hidden',me.role!=='admin');await loadMenu();message('Welcome, '+me.name,true)}catch(x){message(x.message)}};$('logout').onclick=async()=>{await api('logout','POST');location.reload()};
async function loadMenu(){menu=await api('menu');$('menu').replaceChildren();for(let i of menu.items){let a=document.createElement('article');if(i.image_url){let im=document.createElement('img');im.src=i.image_url;im.alt=i.name;a.append(im)}let h=document.createElement('h3');h.textContent=i.name;let p=document.createElement('p');p.textContent=i.description;p.className='muted';let b=document.createElement('button');b.textContent=i.available?'Add':'Sold out';b.disabled=!i.available;b.onclick=()=>{let x=cart.find(y=>y.item_id===i.id);x?x.quantity++:cart.push({item_id:i.id,quantity:1});renderCart()};a.append(h,p,b);$('menu').append(a)}$('itemCategory').replaceChildren(...menu.categories.map(x=>new Option(x.name,x.id)));renderCart();renderCategories();renderInventory()}
function renderCart(){$('cart').replaceChildren();for(let x of cart){let d=document.createElement('div');d.className='row';let n=document.createElement('span');n.textContent=(menu.items.find(i=>i.id===x.item_id)?.name||'Item')+' × '+x.quantity;let m=document.createElement('button');m.className='secondary';m.textContent='−';m.onclick=()=>{if(--x.quantity<1)cart=cart.filter(y=>y!==x);renderCart()};let p=document.createElement('button');p.textContent='+';p.onclick=()=>{if(x.quantity<20)x.quantity++;renderCart()};d.append(n,m,p);$('cart').append(d)}if(!cart.length)$('cart').textContent='Cart is empty'}$('submitOrder').onclick=async()=>{if(!cart.length)return message('Add an item first');try{let r=await api('orders','POST',{lines:cart,to_go:$('togo').checked,notes:$('notes').value});cart=[];renderCart();message('Order #'+r.id+' submitted!',true)}catch(x){message(x.message)}};
async function loadOrders(){try{let os=await api('orders');$('orderList').replaceChildren();for(let o of os){let a=document.createElement('article'),h=document.createElement('h3');h.textContent='#'+o.id+' — '+o.customer+' ('+o.status+')';let p=document.createElement('p');p.textContent=o.lines.map(x=>x.quantity+'× '+x.name).join(', ');a.append(h,p);if(o.notes){let n=document.createElement('p');n.textContent='Note: '+o.notes;n.className='muted';a.append(n)}if(me.role==='admin'){let s=document.createElement('select');['new','preparing','ready','completed','canceled'].forEach(x=>s.add(new Option(x,x)));s.value=o.status;s.onchange=async()=>{await api('orders/'+o.id,'PATCH',{status:s.value});loadOrders()};a.append(s)}$('orderList').append(a)}}catch(x){message(x.message)}}$('refreshOrders').onclick=loadOrders;
$('pinForm').onsubmit=async e=>{e.preventDefault();try{await api('change-pin','POST',{current_pin:$('currentPin').value,new_pin:$('newPin').value});e.target.reset();message('PIN changed.',true)}catch(x){message(x.message)}};
async function loadAdmin(){await Promise.all([adminUsers(),loadMenu()])}async function adminUsers(){let us=await api('admin/users'),t=document.createElement('table');t.innerHTML='<tr><th>Name</th><th>Role</th><th>Actions</th></tr>';for(let u of us){let r=t.insertRow(),n=r.insertCell(),role=r.insertCell(),a=r.insertCell();n.textContent=u.name;role.textContent=u.role;let e=document.createElement('button');e.textContent='Edit';e.className='secondary';e.onclick=()=>openUser(u);let d=document.createElement('button');d.textContent='Delete';d.className='danger';d.disabled=u.id===me.id;d.onclick=async()=>{if(confirm('Delete '+u.name+'?'))try{await api('users/'+u.id,'DELETE');await adminUsers();await loadUsers()}catch(x){message(x.message)}};a.append(e,' ',d)}$('userList').replaceChildren(t)}
function openUser(u){$('userId').value=u?.id||'';$('userName').value=u?.name||'';$('userRole').value=u?.role||'customer';$('userPin').value='';$('userTitle').textContent=u?'Edit user':'Add user';$('pinHint').textContent=u?' Leave blank to keep current PIN.':' Required.';$('userDialog').showModal()}$('addUser').onclick=()=>openUser();$('cancelUser').onclick=()=>$('userDialog').close();$('userForm').onsubmit=async e=>{e.preventDefault();let id=$('userId').value,b={name:$('userName').value,role:$('userRole').value,pin:$('userPin').value};try{await api(id?'users/'+id:'users',id?'PATCH':'POST',b);$('userDialog').close();await adminUsers();await loadUsers();message('User saved.',true)}catch(x){message(x.message)}};
$('categoryForm').onsubmit=async e=>{e.preventDefault();try{await api('categories','POST',{name:$('categoryName').value});e.target.reset();await loadMenu()}catch(x){message(x.message)}};function renderCategories(){let t=document.createElement('table');for(let c of menu.categories){let r=t.insertRow(),n=r.insertCell(),a=r.insertCell(),i=document.createElement('input');i.value=c.name;n.append(i);let s=document.createElement('button');s.textContent='Save';s.onclick=async()=>{await api('categories/'+c.id,'PATCH',{name:i.value,sort_order:c.sort_order});await loadMenu()};let d=document.createElement('button');d.textContent='Delete';d.className='danger';d.onclick=async()=>{if(confirm('Delete category?'))try{await api('categories/'+c.id,'DELETE');await loadMenu()}catch(x){message(x.message)}};a.append(s,' ',d)}$('categoryList').replaceChildren(t)}
$('itemForm').onsubmit=async e=>{e.preventDefault();try{await api('items','POST',{name:$('itemName').value,description:$('itemDesc').value,image_url:$('itemImage').value,category_id:+$('itemCategory').value});e.target.reset();await loadMenu()}catch(x){message(x.message)}};function renderInventory(){let t=document.createElement('table');for(let i of menu.items){let r=t.insertRow(),n=r.insertCell(),v=r.insertCell(),a=r.insertCell();n.textContent=i.name;let c=document.createElement('input');c.type='checkbox';c.checked=!!i.available;c.onchange=()=>api('items/'+i.id,'PATCH',{available:c.checked?1:0});v.append('Available ',c);let e=document.createElement('button');e.textContent='Edit';e.className='secondary';e.onclick=async()=>{let name=prompt('Name',i.name),desc=name===null?null:prompt('Description',i.description);if(desc!==null){await api('items/'+i.id,'PATCH',{name,description:desc});await loadMenu()}};let d=document.createElement('button');d.textContent='Delete';d.className='danger';d.onclick=async()=>{if(confirm('Delete '+i.name+'?')){await api('items/'+i.id,'DELETE');await loadMenu()}};a.append(e,' ',d)}$('inventory').replaceChildren(t)}loadUsers().catch(x=>message(x.message));
</script></body></html>
